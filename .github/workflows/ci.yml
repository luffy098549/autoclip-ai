name: AutoClip AI checks
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app scripts migrations run.py tests
      - run: python -m pytest -q
  ffmpeg-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - name: Render and inspect synthetic owned video
        run: python -m pytest -q tests/test_ffmpeg_end_to_end.py tests/test_authorized_pipeline_integration.py tests/test_audio_peaks_integration.py
  whisper-real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic speech generator
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install real Whisper inference dependencies
        run: python -m pip install -r requirements-ai.txt
      - name: Transcribe locally generated speech with real tiny.en model
        run: python -m pytest -q tests/test_real_whisper_integration.py

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all browser JavaScript syntax
        run: |
          for file in app/static/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
  social-adapter-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional official social SDKs
        run: python -m pip install -r requirements-social.txt
      - name: Test mocked social SDK uploads without credentials
        run: |
          python -m pytest -q tests/test_social_mocked_sdk.py tests/test_social_publisher_adapters.py tests/test_youtube_publisher.py
  celery-redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Start a real Celery worker against Redis
        run: |
          celery -A app.tasks:celery_app worker --loglevel=info --pool=solo --concurrency=1 > /tmp/celery-worker.log 2>&1 &
      - name: Send task and verify worker result
        run: python -m scripts.check_celery_redis
      - name: Worker logs on failure
        if: failure()
        run: cat /tmp/celery-worker.log

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoclip
          POSTGRES_USER: autoclip
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoclip -d autoclip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://autoclip:ci-only-test-password@localhost:5432/autoclip
      SECRET_KEY: ci-only-long-random-placeholder-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: python -m scripts.init_db
      - name: Verify PostgreSQL migrations are idempotent
        run: python -m scripts.init_db
      - name: Detect model and migration schema drift
        run: python -m flask --app 'app:create_app' db check
      - name: Validate PostgreSQL schema and transaction rollback
        run: python -m pytest -q tests/test_postgres_db.py tests/test_postgres_review_concurrency.py tests/test_postgres_clip_claim.py
