<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso privado · AutoClip AI</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="{{ url_for('dashboard.index') }}"><span class="brand-icon">✦</span><span>AutoClip <b>AI</b></span></a>
<h1>Acceso de administrador</h1><p class="muted">Solo el propietario puede registrar fuentes y preparar recortes.</p>
{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Contraseña</label><input id="password" type="password" name="password" minlength="12" autocomplete="current-password" required><button class="button" type="submit">Entrar</button></form>
<p class="smallprint">Primero define ADMIN_PASSWORD_HASH y SECRET_KEY en tu archivo .env privado. Genera el hash con <code>python -m scripts.hash_password</code>.</p></main></body></html>
