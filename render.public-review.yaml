# Opt-in public review environment. Do not deploy until legal owner, hosting costs,
# domain verification and privacy notices have been approved.
# This is separate from render.yaml (main-branch demo).
services:
  - type: web
    name: autoclip-ai-public-review
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/luffy098549/autoclip-ai
    branch: feature/public-site-tiktok-legal-20261115
    autoDeployTrigger: off
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "python -m scripts.init_db && exec gunicorn -b 0.0.0.0:8000 run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoclip-ai-public-review-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: READ_ONLY_DEPLOYMENT
        value: "true"
      - key: PROCESSING_ENABLED
        value: "false"
      - key: AI_ENABLED
        value: "false"
      - key: AUTO_RENDER_ENABLED
        value: "false"
      - key: MONITORING_ENABLED
        value: "false"
      - key: PUBLISHING_ENABLED
        value: "false"
      - key: MEDIA_ROOT
        value: /tmp/autoclip
databases:
  - name: autoclip-ai-public-review-db
    databaseName: autoclip
    plan: free
    region: virginia
    postgresMajorVersion: "16"
